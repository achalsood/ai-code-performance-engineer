[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-code-performance-engineer"
version = "1.0.0"
description = "Evidence-driven code optimization: analyze, benchmark, verify, and accept only proven improvements."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Achal Sood" }]
keywords = ["performance", "static-analysis", "benchmarking", "ai", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6.100"]
release = ["build>=1.2", "twine>=5.1"]

[project.scripts]
perf-engineer = "perf_engineer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/perf_engineer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["perf_engineer"]
