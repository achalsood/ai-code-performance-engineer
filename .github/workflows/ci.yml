name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  code-scan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Generate performance SARIF
        run: perf-engineer analyze src --format sarif --output performance.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: performance.sarif

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=perf_engineer --cov-report=term-missing --cov-fail-under=80

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[dev]'
      - name: Run optimization corpus
        run: |
          mkdir -p artifacts
          perf-engineer evaluate \
            --corpus benchmarks/corpus.json \
            --rounds 9 \
            --history artifacts/history.jsonl \
            --report artifacts/evaluation-report.md \
            > artifacts/evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: performance-evaluation
          path: artifacts/
          retention-days: 30
